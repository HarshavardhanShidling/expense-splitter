<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expense Splitter</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone">

<h2>💰 Expense Splitter</h2>

<div class="input-group">
<label>Total Bill (₹)</label>
<input type="number" id="billAmount" min="1" placeholder="Enter total bill">
</div>

<div class="input-group">
<label>Number of Friends</label>
<input type="number" id="people" min="1" placeholder="Enter number of friends">
</div>

<div class="input-group">
<label>Tip %</label>
<input type="number" id="tip" min="0" placeholder="Optional tip">
</div>

<div class="input-group">
<label>Friend Names (comma separated)</label>
<input type="text" id="names" placeholder="Example: Alex, Sam, John">
</div>

<button onclick="calculateSplit()">Split Bill</button>

<div class="result">
<p>Each Person Pays</p>
<h1 id="result">₹0</h1>
</div>

<h3>Split Details</h3>
<ul id="friendsList"></ul>

<h3>Expense History</h3>
<ul id="history"></ul>

<button class="reset" onclick="reset()">Reset</button>

</div>

<script src="script.js"></script>

</body>
</html>
